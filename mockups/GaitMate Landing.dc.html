<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#eef3f3; }
  a.tile:hover { transform: translateY(-3px); box-shadow:0 8px 24px rgba(31,58,68,.12); }
  a.tile { transition: transform .18s ease, box-shadow .18s ease; }
</style>
</helmet>

<div style="min-height:100vh; display:flex; justify-content:center; padding:40px 24px; font-family:'Public Sans',sans-serif; color:#1f3a44;">
  <div style="width:100%; max-width:760px;">
    <!-- minimal banner -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:26px; height:26px; border-radius:7px; background:#2f6f8f; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">G</div>
        <span style="font-weight:700; font-size:17px;">GaitMate</span>
      </div>
      <div style="width:32px; height:32px; border-radius:50%; background:#cfe3e0;"></div>
    </div>

    <div style="font-family:'Newsreader',serif; font-size:38px; line-height:1.1; font-weight:500; margin:26px 0 10px;">Welcome to GaitMate!</div>
    <div style="font-size:16px; color:#4a6670; max-width:460px; margin-bottom:32px;">Hi Jordan — here's where things stand today. Tap a card to dive in.</div>

    <!-- tiles -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:18px;">
      <a class="tile" href="GaitMate Sprain.dc.html" style="text-decoration:none; color:inherit; display:block;">
        <div style="background:#fff; border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(31,58,68,.05);">
          <div style="height:150px; border-radius:12px; background:#fbfdfc; display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
            <img src="assets/ankle-ligaments.png" alt="Ankle ligaments" style="max-height:140px; max-width:100%; object-fit:contain;">
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-weight:600; font-size:15px;">Track Sprain</div>
              <div style="font-size:12.5px; color:#7b9098; margin-top:2px;">Ligament strain</div>
            </div>
            <span style="color:#2f6f8f; font-size:18px;">→</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:14px;">
            <div style="flex:1; height:4px; border-radius:4px; background:#2a8a5f;"></div>
            <span style="font-size:11px; font-weight:600; color:#2a8a5f;">Healthy</span>
          </div>
        </div>
      </a>
      <a class="tile" href="GaitMate Exercises.dc.html" style="text-decoration:none; color:inherit; display:block;">
        <div style="background:#fff; border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(31,58,68,.05);">
          <div style="height:150px; border-radius:12px; background:repeating-linear-gradient(45deg,#e6efee,#e6efee 11px,#eef4f3 11px,#eef4f3 22px); display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
            <span style="font-family:ui-monospace,monospace; font-size:11px; color:#8aa3a3; background:rgba(255,255,255,.7); padding:4px 8px; border-radius:6px;">dumbbell photo</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-weight:600; font-size:15px;">Current Exercises</div>
              <div style="font-size:12.5px; color:#7b9098; margin-top:2px;">3 for today</div>
            </div>
            <span style="color:#2f6f8f; font-size:18px;">→</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:14px;">
            <div style="flex:1; height:4px; border-radius:4px; background:#d9a32a;"></div>
            <span style="font-size:11px; font-weight:600; color:#d9a32a;">2 due</span>
          </div>
        </div>
      </a>
      <a class="tile" href="GaitMate Falls.dc.html" style="text-decoration:none; color:inherit; display:block;">
        <div style="background:#fff; border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(31,58,68,.05);">
          <div style="height:150px; border-radius:12px; background:repeating-linear-gradient(45deg,#e6efee,#e6efee 11px,#eef4f3 11px,#eef4f3 22px); display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
            <span style="font-family:ui-monospace,monospace; font-size:11px; color:#8aa3a3; background:rgba(255,255,255,.7); padding:4px 8px; border-radius:6px;">falling figure</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-weight:600; font-size:15px;">Fall Tracking</div>
              <div style="font-size:12.5px; color:#7b9098; margin-top:2px;">No recent falls</div>
            </div>
            <span style="color:#2f6f8f; font-size:18px;">→</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:14px;">
            <div style="flex:1; height:4px; border-radius:4px; background:#2a8a5f;"></div>
            <span style="font-size:11px; font-weight:600; color:#2a8a5f;">All clear</span>
          </div>
        </div>
      </a>
    </div>

    <!-- contact -->
    <div style="display:flex; justify-content:center; margin-top:36px;">
      <button style="border:none; background:#2f6f8f; color:#fff; font-family:'Public Sans',sans-serif; font-weight:600; font-size:15px; padding:15px 40px; border-radius:30px; cursor:pointer;">Contact Physician</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
